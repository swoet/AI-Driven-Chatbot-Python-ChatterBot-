<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SupportBot 3D Hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e5e7eb" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="360" fill="url(#bg)"/>

  <!-- Stacked isometric cards -->
  <g filter="url(#shadow)">
    <g transform="translate(250,190) skewX(-18)">
      <rect x="0" y="0" rx="16" ry="16" width="780" height="90" fill="url(#card)"/>
      <text x="24" y="56" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="28" fill="#111827" opacity="0.9">SQLite Knowledge Base</text>
    </g>
    <g transform="translate(220,135) skewX(-18)">
      <rect x="0" y="0" rx="16" ry="16" width="840" height="90" fill="url(#card)"/>
      <text x="24" y="56" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="28" fill="#111827" opacity="0.9">SimpleBot Engine (difflib + persistence)</text>
    </g>
    <g transform="translate(190,80) skewX(-18)">
      <rect x="0" y="0" rx="16" ry="16" width="900" height="90" fill="url(#card)"/>
      <text x="24" y="56" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="28" fill="#111827" opacity="0.9">Web UIs: Flask and FastAPI + HTMX</text>
    </g>
  </g>

  <!-- Title -->
  <text x="640" y="48" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="42" fill="#ffffff">AI-Driven Chatbot</text>
  <text x="640" y="78" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" fill="#e5e7eb" opacity="0.95">Persistent, lightweight, and production-friendly</text>
</svg>
