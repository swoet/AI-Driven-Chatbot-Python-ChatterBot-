<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture 3D">
  <defs>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="360" fill="#0b1220"/>
  <text x="640" y="40" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="28" fill="#e5e7eb">System Architecture (isometric)</text>

  <!-- Base: SQLite DB -->
  <g transform="translate(160,190)" filter="url(#soft)">
    <polygon points="0,60 120,20 260,60 140,100" fill="url(#cubeTop)"/>
    <polygon points="0,60 0,130 140,170 140,100" fill="url(#cubeLeft)"/>
    <polygon points="140,100 140,170 260,130 260,60" fill="url(#cubeRight)"/>
    <text x="130" y="115" text-anchor="middle" font-family="Segoe UI, Roboto, Arial" font-size="16" fill="#fff">SQLite DB</text>
  </g>

  <!-- Middle: SimpleBot Engine -->
  <g transform="translate(410,130)" filter="url(#soft)">
    <polygon points="0,60 120,20 260,60 140,100" fill="url(#cubeTop)"/>
    <polygon points="0,60 0,130 140,170 140,100" fill="url(#cubeLeft)"/>
    <polygon points="140,100 140,170 260,130 260,60" fill="url(#cubeRight)"/>
    <text x="130" y="115" text-anchor="middle" font-family="Segoe UI, Roboto, Arial" font-size="16" fill="#fff">SimpleBot Engine</text>
  </g>

  <!-- Top Left: Flask UI -->
  <g transform="translate(660,75)" filter="url(#soft)">
    <polygon points="0,60 120,20 260,60 140,100" fill="url(#cubeTop)"/>
    <polygon points="0,60 0,130 140,170 140,100" fill="url(#cubeLeft)"/>
    <polygon points="140,100 140,170 260,130 260,60" fill="url(#cubeRight)"/>
    <text x="130" y="115" text-anchor="middle" font-family="Segoe UI, Roboto, Arial" font-size="16" fill="#fff">Flask UI</text>
  </g>

  <!-- Top Right: FastAPI + HTMX -->
  <g transform="translate(910,75)" filter="url(#soft)">
    <polygon points="0,60 120,20 260,60 140,100" fill="url(#cubeTop)"/>
    <polygon points="0,60 0,130 140,170 140,100" fill="url(#cubeLeft)"/>
    <polygon points="140,100 140,170 260,130 260,60" fill="url(#cubeRight)"/>
    <text x="130" y="115" text-anchor="middle" font-family="Segoe UI, Roboto, Arial" font-size="16" fill="#fff">FastAPI + HTMX</text>
  </g>

  <!-- Lines -->
  <g stroke="#64748b" stroke-width="2" opacity="0.8">
    <line x1="480" y1="200" x2="360" y2="240"/>
    <line x1="730" y1="145" x2="600" y2="185"/>
    <line x1="980" y1="145" x2="850" y2="185"/>
  </g>
</svg>
